<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Money Manager — Test UI</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #fff; --line: #e2e5ea; --text: #1c2330;
      --muted: #6b7280; --accent: #2f6feb; --danger: #d92d20; --ok: #067647;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      background: var(--text); color: #fff; padding: 14px 20px; font-weight: 600;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; display: grid; gap: 20px;
      grid-template-columns: 1fr 1fr; }
    .full { grid-column: 1 / -1; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 16px; }
    h2 { margin: 0 0 12px; font-size: 15px; display: flex; justify-content: space-between;
      align-items: center; }
    h3 { margin: 16px 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase;
      letter-spacing: .04em; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 2px; }
    input, select, textarea {
      width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
      font: inherit; background: #fff;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1; min-width: 0; }
    button {
      font: inherit; padding: 7px 12px; border: 1px solid var(--accent); background: var(--accent);
      color: #fff; border-radius: 6px; cursor: pointer;
    }
    button.ghost { background: #fff; color: var(--accent); }
    button.mini { padding: 2px 8px; font-size: 12px; border-color: var(--line); background: #fff;
      color: var(--text); }
    button.mini.danger { color: var(--danger); border-color: #f0c0bb; }
    .actions { margin-top: 12px; }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex;
      justify-content: space-between; align-items: center; gap: 8px; }
    li:last-child { border-bottom: 0; }
    .sub { padding-left: 18px; color: var(--muted); }
    .tag { font-size: 11px; color: var(--muted); }
    .amount { font-variant-numeric: tabular-nums; font-weight: 600; }
    #toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: var(--text); color: #fff; padding: 10px 16px; border-radius: 8px;
      opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90%;
    }
    #toast.show { opacity: 1; }
    #toast.err { background: var(--danger); }
    .empty { color: var(--muted); font-style: italic; padding: 6px 0; }
  </style>
</head>
<body>
  <header>Money Manager — Test UI</header>
  <main>
    <!-- Categories -->
    <section>
      <h2>Categories <button class="ghost mini" onclick="loadCategories()">Reload</button></h2>
      <div class="row">
        <div>
          <label>Name</label>
          <input id="cat-name" placeholder="e.g. Food" />
        </div>
        <div>
          <label>Parent (for a subcategory)</label>
          <select id="cat-parent"><option value="">— top level —</option></select>
        </div>
      </div>
      <div class="actions"><button onclick="createCategory()">Add category</button></div>
      <ul id="cat-list"></ul>
    </section>

    <!-- Accounts -->
    <section>
      <h2>Accounts <button class="ghost mini" onclick="loadAccounts()">Reload</button></h2>
      <div class="row">
        <div>
          <label>Name</label>
          <input id="acc-name" placeholder="e.g. Cash" />
        </div>
        <div>
          <label>Parent (for a sub-account)</label>
          <select id="acc-parent"><option value="">— top level —</option></select>
        </div>
      </div>
      <div class="actions"><button onclick="createAccount()">Add account</button></div>
      <ul id="acc-list"></ul>
    </section>

    <!-- New transaction -->
    <section class="full">
      <h2>Add expense</h2>
      <div class="row">
        <div>
          <label>Date</label>
          <input id="tx-date" type="date" />
        </div>
        <div>
          <label>Amount</label>
          <input id="tx-amount" type="number" step="0.01" min="0.01" placeholder="0.00" />
        </div>
        <div>
          <label>Category</label>
          <select id="tx-category"></select>
        </div>
        <div>
          <label>Account</label>
          <select id="tx-account"></select>
        </div>
      </div>
      <div class="row">
        <div>
          <label>Note</label>
          <input id="tx-note" placeholder="short note" />
        </div>
        <div>
          <label>Description</label>
          <input id="tx-desc" placeholder="longer description" />
        </div>
      </div>
      <div class="actions"><button onclick="createTransaction()">Add expense</button></div>
    </section>

    <!-- Transactions list -->
    <section class="full">
      <h2>Transactions <button class="ghost mini" onclick="loadTransactions()">Reload</button></h2>
      <div class="row">
        <div>
          <label>Type</label>
          <select id="f-type">
            <option value="">any</option>
            <option value="expense">expense</option>
            <option value="income">income</option>
            <option value="transfer">transfer</option>
          </select>
        </div>
        <div>
          <label>Category</label>
          <select id="f-category"><option value="">any</option></select>
        </div>
        <div>
          <label>Account</label>
          <select id="f-account"><option value="">any</option></select>
        </div>
        <div>
          <label>From</label>
          <input id="f-from" type="date" />
        </div>
        <div>
          <label>To</label>
          <input id="f-to" type="date" />
        </div>
        <div style="display:flex; align-items:flex-end; gap:8px;">
          <button onclick="loadTransactions()">Filter</button>
          <button class="ghost" onclick="clearFilters()">Clear</button>
        </div>
      </div>
      <ul id="tx-list"></ul>
    </section>
  </main>
  <div id="toast"></div>

  <script>
    // ---- helpers -------------------------------------------------------
    let CATEGORIES = [];   // top-level, each with .subcategories
    let ACCOUNTS = [];     // top-level, each with .subaccounts

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      if (res.status === 204) return null;
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const detail = data && data.detail ? data.detail : res.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return data;
    }

    function toast(msg, isErr) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "show" + (isErr ? " err" : "");
      setTimeout(() => (t.className = ""), 2600);
    }

    async function run(fn) {
      try { await fn(); } catch (e) { toast(e.message, true); }
    }

    function catLabel(cat, sub) {
      return sub ? `${cat.name} / ${sub.name}` : cat.name;
    }
    function accLabel(acc, sub) {
      return sub ? `${acc.name} / ${sub.name}` : acc.name;
    }

    // ---- categories ----------------------------------------------------
    async function loadCategories() {
      CATEGORIES = await api("GET", "/categories");
      // parent dropdown (top-level only)
      const parent = document.getElementById("cat-parent");
      parent.innerHTML = '<option value="">— top level —</option>' +
        CATEGORIES.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
      // category dropdowns for tx create + filter (flatten)
      const opts = [];
      for (const c of CATEGORIES) {
        opts.push(`<option value="${c.id}">${c.name}</option>`);
        for (const s of c.subcategories)
          opts.push(`<option value="${s.id}">${catLabel(c, s)}</option>`);
      }
      document.getElementById("tx-category").innerHTML = opts.length
        ? opts.join("")
        : '<option value="" disabled selected>— add a category first —</option>';
      document.getElementById("f-category").innerHTML =
        '<option value="">any</option>' + opts.join("");
      // list
      const list = document.getElementById("cat-list");
      if (!CATEGORIES.length) { list.innerHTML = '<li class="empty">No categories yet.</li>'; return; }
      list.innerHTML = CATEGORIES.map(c => `
        <li>
          <span><strong>${c.name}</strong> <span class="tag">${c.type}</span></span>
          <span>
            <button class="mini" onclick="renameCategory(${c.id}, '${escapeAttr(c.name)}')">Edit</button>
            <button class="mini danger" onclick="deleteCategory(${c.id})">Delete</button>
          </span>
        </li>
        ${c.subcategories.map(s => `
          <li class="sub">
            <span>↳ ${s.name}</span>
            <span>
              <button class="mini" onclick="renameCategory(${s.id}, '${escapeAttr(s.name)}')">Edit</button>
              <button class="mini danger" onclick="deleteCategory(${s.id})">Delete</button>
            </span>
          </li>`).join("")}
      `).join("");
    }

    function createCategory() {
      run(async () => {
        const name = document.getElementById("cat-name").value.trim();
        if (!name) throw new Error("Name is required");
        const parent = document.getElementById("cat-parent").value;
        const body = { name };
        if (parent) body.parent_id = Number(parent);
        await api("POST", "/categories", body);
        document.getElementById("cat-name").value = "";
        toast("Category added");
        await loadCategories();
      });
    }

    function renameCategory(id, current) {
      const name = prompt("New name", current);
      if (name === null) return;
      run(async () => {
        await api("PATCH", `/categories/${id}`, { name: name.trim() });
        toast("Renamed");
        await loadCategories();
      });
    }

    function deleteCategory(id) {
      if (!confirm("Delete this category?")) return;
      run(async () => {
        await api("DELETE", `/categories/${id}`);
        toast("Deleted");
        await loadCategories();
      });
    }

    // ---- accounts ------------------------------------------------------
    async function loadAccounts() {
      ACCOUNTS = await api("GET", "/accounts");
      // parent dropdown (top-level only)
      const parent = document.getElementById("acc-parent");
      parent.innerHTML = '<option value="">— top level —</option>' +
        ACCOUNTS.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
      // account dropdowns for tx create + filter (flatten)
      const opts = [];
      for (const a of ACCOUNTS) {
        opts.push(`<option value="${a.id}">${a.name}</option>`);
        for (const s of a.subaccounts)
          opts.push(`<option value="${s.id}">${accLabel(a, s)}</option>`);
      }
      document.getElementById("tx-account").innerHTML = opts.length
        ? opts.join("")
        : '<option value="" disabled selected>— add an account first —</option>';
      document.getElementById("f-account").innerHTML =
        '<option value="">any</option>' + opts.join("");
      // list
      const list = document.getElementById("acc-list");
      if (!ACCOUNTS.length) { list.innerHTML = '<li class="empty">No accounts yet.</li>'; return; }
      list.innerHTML = ACCOUNTS.map(a => `
        <li>
          <span><strong>${a.name}</strong></span>
          <span>
            <button class="mini" onclick="renameAccount(${a.id}, '${escapeAttr(a.name)}')">Edit</button>
            <button class="mini danger" onclick="deleteAccount(${a.id})">Delete</button>
          </span>
        </li>
        ${a.subaccounts.map(s => `
          <li class="sub">
            <span>↳ ${s.name}</span>
            <span>
              <button class="mini" onclick="renameAccount(${s.id}, '${escapeAttr(s.name)}')">Edit</button>
              <button class="mini danger" onclick="deleteAccount(${s.id})">Delete</button>
            </span>
          </li>`).join("")}
      `).join("");
    }

    function createAccount() {
      run(async () => {
        const name = document.getElementById("acc-name").value.trim();
        if (!name) throw new Error("Name is required");
        const parent = document.getElementById("acc-parent").value;
        const body = { name };
        if (parent) body.parent_id = Number(parent);
        await api("POST", "/accounts", body);
        document.getElementById("acc-name").value = "";
        toast("Account added");
        await loadAccounts();
      });
    }

    function renameAccount(id, current) {
      const name = prompt("New name", current);
      if (name === null) return;
      run(async () => {
        await api("PATCH", `/accounts/${id}`, { name: name.trim() });
        toast("Renamed");
        await loadAccounts();
      });
    }

    function deleteAccount(id) {
      if (!confirm("Delete this account?")) return;
      run(async () => {
        await api("DELETE", `/accounts/${id}`);
        toast("Deleted");
        await loadAccounts();
      });
    }

    // ---- transactions --------------------------------------------------
    function labelForCategory(id) {
      for (const c of CATEGORIES) {
        if (c.id === id) return c.name;
        for (const s of c.subcategories) if (s.id === id) return catLabel(c, s);
      }
      return id == null ? "—" : `#${id}`;
    }
    function labelForAccount(id) {
      for (const a of ACCOUNTS) {
        if (a.id === id) return a.name;
        for (const s of a.subaccounts) if (s.id === id) return accLabel(a, s);
      }
      return id == null ? "—" : `#${id}`;
    }

    function createTransaction() {
      run(async () => {
        const amount = document.getElementById("tx-amount").value;
        const category = document.getElementById("tx-category").value;
        const account = document.getElementById("tx-account").value;
        if (!amount) throw new Error("Amount is required");
        if (!category) throw new Error("Pick a category (add one first)");
        if (!account) throw new Error("Pick an account (add one first)");
        const body = {
          amount,
          category_id: Number(category),
          account_id: Number(account),
          note: document.getElementById("tx-note").value.trim() || null,
          description: document.getElementById("tx-desc").value.trim() || null,
        };
        const date = document.getElementById("tx-date").value;
        if (date) body.date = date;
        await api("POST", "/transactions", body);
        document.getElementById("tx-amount").value = "";
        document.getElementById("tx-note").value = "";
        document.getElementById("tx-desc").value = "";
        toast("Expense added");
        await loadTransactions();
      });
    }

    async function loadTransactions() {
      const params = new URLSearchParams();
      const type = document.getElementById("f-type").value;
      const cat = document.getElementById("f-category").value;
      const acc = document.getElementById("f-account").value;
      const from = document.getElementById("f-from").value;
      const to = document.getElementById("f-to").value;
      if (type) params.set("type", type);
      if (cat) params.set("category_id", cat);
      if (acc) params.set("account_id", acc);
      if (from) params.set("date_from", from);
      if (to) params.set("date_to", to);
      const qs = params.toString();
      const rows = await api("GET", "/transactions" + (qs ? "?" + qs : ""));
      const list = document.getElementById("tx-list");
      if (!rows.length) { list.innerHTML = '<li class="empty">No transactions.</li>'; return; }
      list.innerHTML = rows.map(t => `
        <li>
          <span>
            <span class="tag">${t.date}</span>
            <strong>${labelForCategory(t.category_id)}</strong>
            · ${labelForAccount(t.account_id)}
            ${t.note ? `· ${escapeHtml(t.note)}` : ""}
          </span>
          <span>
            <span class="amount">${Number(t.amount).toFixed(2)}</span>
            <button class="mini danger" onclick="deleteTransaction(${t.id})">Delete</button>
          </span>
        </li>`).join("");
    }

    function deleteTransaction(id) {
      if (!confirm("Delete this transaction?")) return;
      run(async () => {
        await api("DELETE", `/transactions/${id}`);
        toast("Deleted");
        await loadTransactions();
      });
    }

    function clearFilters() {
      for (const id of ["f-type", "f-category", "f-account", "f-from", "f-to"])
        document.getElementById(id).value = "";
      loadTransactions();
    }

    // ---- escaping ------------------------------------------------------
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function escapeAttr(s) { return escapeHtml(s).replace(/'/g, "\\'"); }

    // ---- init ----------------------------------------------------------
    document.getElementById("tx-date").valueAsDate = new Date();
    run(async () => { await loadCategories(); await loadAccounts(); await loadTransactions(); });
  </script>
</body>
</html>
