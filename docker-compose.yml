services:
  money-manager:
    build: .
    image: money-manager
    container_name: money-manager
    # Must match APP_UID:APP_GID baked into the image so the process can write
    # to the bind-mounted data directory.
    user: "10001:10001"
    ports:
      - "8000:8000"
    volumes:
      # Host directory holding the SQLite database; survives container restarts
      # and rebuilds. Create it once and give UID 10001 ownership:
      #   sudo mkdir -p /var/lib/money-manager
      #   sudo chown 10001:10001 /var/lib/money-manager
      - /var/lib/money-manager:/var/lib/money-manager
    restart: unless-stopped
